x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 8000
  DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ENABLE_PROTOTYPE_ROUTES: ${ENABLE_PROTOTYPE_ROUTES:-false}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_ISSUER: ${JWT_ISSUER:-genbioca-compliance}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
  RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-600}
  RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
  RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-60}
  FRONTEND_DIST: ../frontend/dist
  PROTOTYPE_DIR: ../docs/prototype
  FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
  # Container WORKDIR is /app/backend; uploads live under that tree.
  LOCAL_UPLOAD_DIR: /app/backend/uploads
  EVIDENCE_MAX_UPLOAD_BYTES: ${EVIDENCE_MAX_UPLOAD_BYTES:-10485760}
  EVIDENCE_UPLOAD_RATE_MAX: ${EVIDENCE_UPLOAD_RATE_MAX:-20}
  EVIDENCE_UPLOAD_RATE_WINDOW_MS: ${EVIDENCE_UPLOAD_RATE_WINDOW_MS:-900000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - genbioca_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?TEST_POSTGRES_DB is required}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?TEST_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?TEST_POSTGRES_PASSWORD is required}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - genbioca_postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: ["tools"]
    build: *app-build
    command: ["npm", "run", "prisma:migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: *app-build
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      # Local/UAT evidence file persistence only — not production object storage.
      - genbioca_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  genbioca_postgres:
  genbioca_postgres_test:
  genbioca_uploads:
