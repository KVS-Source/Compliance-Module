services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genbioca_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - genbioca_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genbioca_compliance"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/genbioca_compliance?schema=public
      JWT_ACCESS_SECRET: docker-development-secret-change-before-any-shared-deployment
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_DAYS: 7
      COOKIE_SECURE: "false"
      FRONTEND_DIST: ../frontend/dist
      PROTOTYPE_DIR: ../docs/prototype
      FILE_STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: ./uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  genbioca_postgres:
