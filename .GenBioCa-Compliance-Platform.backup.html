  function nextId(prefix,records){const n=Math.max(0,...records.map(r=>parseInt(String(r.id).replace(/\D/g,''))||0))+1;return `${prefix}-${String(n).padStart(3,'0')}`}
  function addAuditEvent(module,record,action,oldValue='—',newValue='—',reason='Prototype action'){
    state.auditTrail.unshift({id:nextId('AUD',state.auditTrail),companyId:state.selectedCompanyId,date:`${formatDate()}, ${nowText()}`,user:'User 001',module,record,action,old:oldValue,next:newValue,reason,ip:'192.0.2.21',browser:'Current browser',location:'Location 001'});saveState()
  }
  function addNotification(title,type,route,priority='Medium'){
    state.notifications.unshift({id:nextId('NOT',state.notifications),companyId:state.selectedCompanyId,title,type,route,time:'Just now',priority,read:false,action:true});saveState()
  }
  function calculateKpiResult(kpi,target,actual){
    if(actual===''||actual===null||actual===undefined)return{variance:'—',variancePercentage:'—',rag:'Grey',targetMet:false,recommendedRiskLevel:'None',reason:'Enter a numeric actual value.'};const a=Number(actual),isRange=kpi.direction==='Target Range',range=isRange?(Array.isArray(target)?target:[Number(kpi.targetMin??target),Number(kpi.targetMax??target)]):null,t=isRange?(range[0]+range[1])/2:Number(target);if(!Number.isFinite(a)||!Number.isFinite(t)||isRange&&!range.every(Number.isFinite))return{variance:'—',variancePercentage:'—',rag:'Grey',targetMet:false,recommendedRiskLevel:'None',reason:'Enter a valid numeric actual and target.'};
    let met=false,amber=false,variance=a-t;
    if(kpi.direction==='Lower is Better'){met=a<=t;amber=!met&&a<=t*1.1;variance=t-a}
    else if(kpi.direction==='Target Range'){const [min,max]=range;met=a>=min&&a<=max;amber=!met&&a>=min-(Math.abs(min)*.1)&&a<=max+(Math.abs(max)*.1);variance=met?0:a<min?a-min:a-max}
    else{met=a>=t;amber=!met&&a>=t*.9}
    const variancePercentage=t===0?0:(variance/t*100);const rag=met?'Green':kpi.critical?'Red':amber?'Amber':'Red';const repeatedMiss=scoped(state.kpiActuals).some(x=>x.kpiId===kpi.id&&x.status!=='Draft'&&x.rag&&x.rag!=='Green');const recommendedRiskLevel=met?'None':(!amber||kpi.critical||repeatedMiss?'Major':'Minor');
    return{variance:variance.toFixed(1),variancePercentage:`${variancePercentage>0?'+':''}${variancePercentage.toFixed(1)}%`,rag,targetMet:met,recommendedRiskLevel,reason:met?'Approved target is met.':recommendedRiskLevel==='Major'?'Actual is more than 10% beyond the target, the KPI is critical, or a repeat miss exists.':'Actual missed the target but remains within the 10% tolerance.'}
  }

  function renderLogin(){
    document.title='Sign in · GenBioCa Compliance Platform';
    $('#root').innerHTML=`<main class="login" id="page-content">
      <section class="login-hero" aria-label="GenBioCa"><div class="login-grid"></div><div class="login-glow"></div>
        <div class="login-hero-logo-wrap"><img class="login-hero-logo" src="${GENBIOCA_LOGO}" alt="GenBioCa"></div>
      </section>
      <section class="login-side"><div class="login-card"><div class="login-card-logo-wrap"><img class="login-card-logo" src="${GENBIOCA_LOGO}" alt="GenBioCa"></div>
        <h2>Welcome back</h2><p class="muted">Sign in to your secure workspace</p>
        <form id="login-form" novalidate><div class="field"><label for="login-email">Email</label><input class="control" id="login-email" name="email" type="email" value="admin001@example.test" autocomplete="email" aria-describedby="email-error"><div class="error" id="email-error"></div></div>
          <div class="field"><label for="login-password">Password</label><div class="password-wrap"><input class="control" id="login-password" name="password" type="password" value="admin123" autocomplete="current-password" aria-describedby="password-error"><button class="inside-btn" type="button" data-action="toggle-password" aria-label="Show password">${icon('eye',17)}</button></div><div class="error" id="password-error"></div></div>
          <div class="login-row"><label class="check"><input id="keep-signed" type="checkbox"> Keep me signed in</label><button type="button" class="text-btn" data-action="forgot-password">Forgot password?</button></div>
          <button class="btn btn-primary btn-block" type="submit">${icon('log-in',16)}<span>Sign In</span></button>
        </form>
        <div class="login-foot"><span id="login-clock">${formatDate()} · ${nowText()}</span><span>Location 001</span><button class="text-btn" data-action="info-modal" data-title="Privacy">Privacy</button><button class="text-btn" data-action="info-modal" data-title="Security">Security</button><button class="text-btn" data-action="info-modal" data-title="Support">Support</button></div>
      </div></section></main>`;
    refreshIcons();
  }
  function navHtml(){
    const current=ui.route;return NAV_GROUPS.map(g=>{
      const isActive=g.items.some(x=>x[1]===current);const open=state.sidebar.openGroups.includes(g.id);
      return `<div class="nav-group ${open?'open':''}" data-group="${g.id}"><button class="nav-group-btn" data-action="toggle-group" data-group="${g.id}" aria-expanded="${open}" aria-controls="nav-${g.id}" title="${esc(g.label)}"><span class="nav-icon">${icon(g.icon)}</span><span class="nav-group-label">${esc(g.label)}</span><span class="nav-chevron">${icon('chevron-down',14)}</span></button><div class="nav-children" id="nav-${g.id}">${g.items.map(([label,route])=>`<a href="${route}" class="nav-link ${current===route?'active':''}" ${current===route?'aria-current="page"':''} title="${esc(label)}"><span class="nav-icon">${icon(ROUTES[route]?.[3]||'circle',17)}</span><span class="nav-label">${esc(label)}</span>${route==='#evidence/review'?`<span class="nav-count">${pendingEvidence().length}</span>`:''}</a>`).join('')}</div></div>`
    }).join('')
  }
  function approvalCount(){return kpiApprovalRows().filter(a=>['Pending Approval','Clarification Requested'].includes(a.status)).length+pendingEvidence().length+scoped(state.policies).filter(p=>p.approval==='Under Review').length+scoped(state.capa).filter(c=>c.status==='Under Verification').length}
  const pendingEvidence=()=>scoped(state.evidence).filter(e=>e.status==='Pending');
  function renderShell(){

  function kpiApprovalRows(){const seeds=scoped(state.kpis).map(k=>{const result=calculateKpiResult(k,k.target,k.actual),ev=scoped(state.evidence).find(e=>e.id===k.evidence),evidence=ev?.status||'Not Uploaded',defaultStatus=result.targetMet&&evidence==='Approved'?'Approved':'Pending Approval';return{id:`APP-${k.id}`,kpi:`${k.id} · ${k.name}`,kpiId:k.id,period:'Q2 2026',target:`${k.target}${k.unit}`,actual:`${k.actual}${k.unit}`,variance:result.variancePercentage,rag:result.rag,risk:result.recommendedRiskLevel,evidence,by:k.owner,date:'10 Jul 2026',status:k.approvalStatus||defaultStatus}});return [...scoped(state.kpiActuals).filter(a=>a.status!=='Draft').map(a=>({...a,id:a.id,kpi:`${a.kpiId} · ${state.kpis.find(k=>k.id===a.kpiId)?.name}`,target:`${a.target}`,actual:`${a.actual}`,variance:a.variancePercentage,risk:a.riskLevel,evidence:a.evidenceStatus,by:a.by||'User 001',date:a.submittedAt})),...seeds]}

  function renderApprovalTable(rows){const q=ui.tableSearch.toLowerCase(),status=ui.pageFilters.Status,evidenceFilter=ui.pageFilters.Evidence,ragFilter=ui.pageFilters.RAG;rows=rows.filter(r=>(!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q)))&&(!status||/^All/.test(status)||r.status===status)&&(!evidenceFilter||/^All/.test(evidenceFilter)||r.evidence===evidenceFilter)&&(!ragFilter||/^All/.test(ragFilter)||r.rag===ragFilter));return`<div class="card"><div class="table-wrap"><table class="data-table"><caption>KPI approval queue — ${rows.length} records</caption><thead><tr>${['KPI','Period','Target','Actual','Variance %','RAG','Risk Preview','Evidence Status','Submitted By','Submitted Date','Approval Status','Actions'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{const final=['Approved','Rejected'].includes(r.status),canApprove=r.evidence==='Approved'&&!final;return`<tr><td>${renderCell('kpi',r.kpi,r)}</td><td>${r.period}</td><td>${r.target}</td><td>${r.actual}</td><td>${r.variance}</td><td>${badge(r.rag)}</td><td>${badge(r.risk)}</td><td>${badge(r.evidence)}</td><td>${r.by}</td><td>${r.date}</td><td>${badge(r.status)}</td><td><div class="actions"><button class="tiny-btn" data-action="view-record" data-id="${r.id}" aria-label="View ${r.kpiId}">${icon('eye',14)}</button><button class="tiny-btn" data-action="preview-kpi-evidence" data-id="${r.id}" data-kpi="${r.kpiId}" aria-label="Preview evidence for ${r.kpiId}">${icon('file-search',14)}</button><button class="tiny-btn" data-action="approve-kpi" data-id="${r.id}" data-kpi="${r.kpiId}" ${canApprove?'':'disabled title="Approved evidence required or record already final"'} aria-label="Approve ${r.kpiId}">${icon('check',14)}</button><button class="tiny-btn" data-action="reject-kpi" data-id="${r.id}" ${final?'disabled':''} aria-label="Reject ${r.kpiId}">${icon('x',14)}</button><button class="tiny-btn" data-action="clarify-kpi" data-id="${r.id}" ${final?'disabled':''} aria-label="Ask for   function renderPolicyRegister(){const rows=scoped(state.policies).map(p=>({...p,policy:`${p.id} · ${p.name}`,linked:`${p.framework} · ${p.control} · ${p.kpi}`,cycle:`${p.effective} → ${p.review}`,documentReviewer:`${p.document} · ${p.reviewer}`}));const cards=[['Total Policies',rows.length,'notebook-tabs','blue'],['Approved',rows.filter(x=>x.approval==='Approved').length,'badge-check','green'],['Pending Review',rows.filter(x=>x.approval==='Under Review').length,'clock','amber'],['Expired',0,'calendar-x','red'],['Without Evidence',rows.filter(x=>x.evidence!=='Approved').length,'file-warning','red'],['Due This Month',rows.filter(x=>x.review.includes('Jul 2026')).length,'calendar-clock','amber']];return`<div class="page">${pageHead('Add Policy','Export CSV')}<div class="cards">${cards.map(x=>summaryCard(...x,'Click to filter')).join('')}</div><div class="banner warning">${icon('file-warning',18)}<span>A policy cannot be approved without an approved policy document or supporting evidence.</span></div>${filterBar({placeholder:'Search policy register…'})}${renderPolicyTable(rows)}</div>`}

  document.addEventListener('submit',e=>{if(e.target.id!=='edit-record-form')return;const id=e.target.dataset.id,record=findRecord(id);if(!record)return;const old=JSON.stringify(record);$$('[data-key]',e.target).forEach(x=>record[x.dataset.key]=x.value.trim());addAuditEvent(ROUTES[ui.route]?.[0]||'Record',id,'Updated Record',old,JSON.stringify(record),'Edited from record form');saveState();closeOverlay();showToast('success','Record updated',`${id} changes were saved.`);renderApp()});
  </script>
